# Cloudflare Worker config for the Mearva Seafood chat + lead backend.
#
# Secrets are NOT stored here. Set them once (never commit their values):
#   npx wrangler secret put ANTHROPIC_API_KEY   # Anthropic key (already set)
#   npx wrangler secret put WEB3FORMS_KEY        # Web3Forms access key for /api/lead
#
# WEB3FORMS_KEY is the same access key the website quote form already uses
# (delivers to sales@mearvaseafood.com). /api/lead submits to Web3Forms
# server-side so the key never appears in widget.js or the repo.
#
# Phase 2E — customer confirmation email via Microsoft 365 (Microsoft Graph).
# OFF until all of these are set AND CONFIRMATION_ENABLED = "true". Until then
# the confirmation step is a guarded no-op and the lead flow is unaffected.
#   npx wrangler secret put MS_TENANT_ID
#   npx wrangler secret put MS_CLIENT_ID
#   npx wrangler secret put MS_CLIENT_SECRET
#   npx wrangler secret put MS_SENDER          # e.g. no-reply@mearvaseafood.com
#   npx wrangler secret put CONFIRMATION_ENABLED   # "true" to switch on
# Requires an Entra ID app with Mail.Send (application) permission, admin-
# consented, ideally scoped to the sender mailbox via an Application Access Policy.

name = "mearva-chat"
main = "worker.js"
compatibility_date = "2026-08-15"

# Optional: override the model without editing code.
# Default in worker.js is claude-sonnet-4-6.
[vars]
MODEL = "claude-sonnet-4-6"
MS_SENDER = "no-reply@mearvaseafood.com"
CONFIRMATION_ENABLED = "true"

# Rate limiting store (20 requests / IP / hour). Create it once with:
#   npx wrangler kv namespace create RATE_LIMIT
# then paste the returned id below. If this binding is omitted, the Worker
# still runs but rate limiting is disabled.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "02eb1d06b5e3481fb082469f9b01ae16"
